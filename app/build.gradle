plugins {
    id "com.android.application"
}

android {
    namespace "com.mohnish.aircanvas"
    compileSdk 36

    defaultConfig {
        applicationId "com.mohnish.aircanvas"
        minSdk 26
        targetSdk 36
        versionCode 24
        versionName "2.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Phone release: keep both current Android ARM architectures while
        // avoiding roughly 28 MB of emulator-only x86 native libraries.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Codename builds are installable without repository secrets.
            // Replace this with a private release keystore before Play publication.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress "task", "tflite"
    }

    packaging {
        resources {
            excludes += [
                    "/META-INF/{AL2.0,LGPL2.1}",
                    "META-INF/DEPENDENCIES",
                    "META-INF/NOTICE.md",
                    "META-INF/LICENSE.md"
            ]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable "ObsoleteLintCustomCheck"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.camera:camera-core:1.6.1"
    implementation "androidx.camera:camera-camera2:1.6.1"
    implementation "androidx.camera:camera-lifecycle:1.6.1"
    implementation "androidx.camera:camera-view:1.6.1"
    // Pinned to the API generation used by the current official Hand Landmarker sample.
    //noinspection GradleDependency
    implementation "com.google.mediapipe:tasks-vision:0.10.35"
    // On-device handwriting recognition. The selected language model is
    // downloaded once, then inference stays local.
    implementation "com.google.mlkit:digital-ink-recognition:19.0.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260719"
}
